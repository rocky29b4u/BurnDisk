[package]
name = "burn-disk"
version = "1.0.0"
edition = "2021"
rust-version = "1.80"
description = "BurnDisk - a Rust disc burning and ISO creation tool, ported from DiscBurner/BurnAware concepts"
license = "MIT"
authors = ["rocky29b4u <rocky29b4u@gmail.com>"]

[[bin]]
name = "burn-disk"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
libmkiso = { version = "0.1", optional = true }

[features]
default = []
iso = ["dep:libmkiso"]

[dev-dependencies]

[profile.release]
opt-level = 3
lto = true